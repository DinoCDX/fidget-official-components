[package]
name = "launcher-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
arboard = "3"
launcher-core = { path = "../launcher-core" }
launcher-settings = { path = "../launcher-settings" }
raw-window-handle = "0.6"
walkdir = "2"

[target.'cfg(windows)'.dependencies]
window-vibrancy = "0.5"
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_Storage_FileSystem"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"
