[workspace]
resolver = "3"
members = ["components/*/crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "2"
directories = "6"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
